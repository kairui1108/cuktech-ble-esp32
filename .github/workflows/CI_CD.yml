name: Sync, Build & Release

on:
  workflow_dispatch:
    inputs:
      force_release:
        description: '强制发布 Release（即使版本未变更）'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 */2 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      changed: ${{ steps.version.outputs.changed }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - name: Clone this repo
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Clone upstream
        run: |
          git clone https://${{ secrets.PAT_TOKEN }}@github.com/kairui1108/cuktech-ble-ha.git /tmp/upstream

      - name: Check version change
        id: version
        run: |
          UPSTREAM_VER=$(grep '^## v' /tmp/upstream/esp32_ble/RELEASE_NOTE.md | head -1 | sed 's/## v//')
          CURRENT_VER=$(grep '^## v' RELEASE_NOTE.md 2>/dev/null | head -1 | sed 's/## v//' || echo "0.0.0")
          echo "version=$UPSTREAM_VER" >> $GITHUB_OUTPUT
          echo "upstream=$UPSTREAM_VER" >> $GITHUB_OUTPUT
          echo "current=$CURRENT_VER" >> $GITHUB_OUTPUT
          if [ "$UPSTREAM_VER" != "$CURRENT_VER" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Sync files
        run: |
          rsync -av --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='build' \
            --exclude='sdkconfig' \
            --exclude='*.pyc' \
            /tmp/upstream/esp32_ble/ ./
          cp /tmp/upstream/docs/esp32-readme.md README.md
          cp /tmp/upstream/docs/esp32-readme-en.md README.en.md

      - name: Extract release notes
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.upstream }}"
          if [ -f RELEASE_NOTE.md ]; then
            NOTES=$(awk -v ver="${VERSION}" 'BEGIN{f=0} $0 ~ ("^## v" ver){f=1; next} f && $0 ~ "^## v" {exit} f{print}' RELEASE_NOTE.md)
          fi
          NOTES="${NOTES:-See commit history for changes.}"
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://${{ secrets.PAT_TOKEN }}@github.com/kairui1108/cuktech-ble-esp32.git
          git add .
          if ! git diff --cached --quiet; then
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "Sync esp32_ble from upstream (${TIMESTAMP})"
            git push origin HEAD
          fi

  build:
    needs: sync
    strategy:
      fail-fast: false
      matrix:
        target: [esp32, esp32s3, esp32c3]
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.5
    steps:
      - name: Checkout synced code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ github.ref }}

      - name: Build firmware
        run: |
          . /opt/esp/idf/export.sh
          idf.py set-target ${{ matrix.target }}
          # Regenerate embedded_files.h from data/ directory (generated file
          # is not committed to the upstream repo)
          python tools/generate_embedded.py
          idf.py build
          # Merge bootloader+partition-table+app into single firmware.bin
          BOOT_OFFSET="0x1000"
          [ "${{ matrix.target }}" != "esp32" ] && BOOT_OFFSET="0x0"
          python -m esptool --chip "${{ matrix.target }}" merge_bin \
            -o build/firmware.bin \
            "$BOOT_OFFSET" build/bootloader/bootloader.bin \
            0x8000 build/partition_table/partition-table.bin \
            0x10000 build/cuktech_ble.bin

      - name: Prepare artifacts and zip
        run: |
          TARGET=${{ matrix.target }}
          DIST="dist/${TARGET}"
          mkdir -p "${DIST}"

          BUILD_DIR="."
          [ -d esp32_ble/build ] && BUILD_DIR="esp32_ble"
          cp "${BUILD_DIR}/build/firmware.bin" "${DIST}/"

          # Determine flash params
          FLASH_MODE="dio"; FLASH_SIZE="4MB"
          if [ "${TARGET}" = "esp32s3" ]; then
            FLASH_MODE="qio"; FLASH_SIZE="8MB"
          fi

          # Write flash script (auto-detects hyphen vs underscore args)
          cat > "${DIST}/flash.py" << PYEOF
          #!/usr/bin/env python3
          """Flash CUKTECH BLE firmware to ${TARGET}."""
          import subprocess, os, sys
          DIR = os.path.dirname(os.path.abspath(__file__))

          def _fmt(*names):
              \"\"\"Probe esptool to pick right arg format (hyphen vs underscore).\"\"\"
              try:
                  out = subprocess.run(
                      ["python", "-m", "esptool", "--help"],
                      capture_output=True, text=True, timeout=5).stdout
                  for n in names:
                      if n in out:
                          return n
              except Exception:
                  pass
              return names[-1]  # fallback to underscore

          before = _fmt("default-reset", "default_reset")
          after  = _fmt("hard-reset",    "hard_reset")
          op     = _fmt("write-flash",   "write_flash")
          fm_opt = _fmt("--flash-mode",  "--flash_mode")
          fs_opt = _fmt("--flash-size",  "--flash_size")
          port   = sys.argv[1] if len(sys.argv) > 1 else "/dev/ttyUSB0"
          cmd = [
              "python", "-m", "esptool", "--chip", "${TARGET}", "-p", port,
              "-b", "460800",
              "--before", before, "--after", after,
              op, fm_opt, "${FLASH_MODE}", fs_opt, "${FLASH_SIZE}",
              "0x0", os.path.join(DIR, "firmware.bin"),
          ]
          print(f"Flashing ${TARGET}...")
          subprocess.run(cmd, check=True)
          print("Done!")
          PYEOF
          chmod +x "${DIST}/flash.py"

          # Zip it
          cd dist
          zip -r "cuktech-ble-${TARGET}.zip" "${TARGET}/"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cuktech-ble-${{ matrix.target }}
          path: dist/cuktech-ble-${{ matrix.target }}.zip

  release:
    needs: [sync, build]
    if: needs.sync.outputs.changed == 'true' || inputs.force_release == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          cp artifacts/cuktech-ble-esp32/cuktech-ble-esp32.zip release/
          cp artifacts/cuktech-ble-esp32s3/cuktech-ble-esp32s3.zip release/
          cp artifacts/cuktech-ble-esp32c3/cuktech-ble-esp32c3.zip release/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.sync.outputs.version }}
          name: v${{ needs.sync.outputs.version }}
          body: |
            ${{ needs.sync.outputs.notes }}

            ## 下载

            | 平台 | 文件 |
            |---|---|
            | **ESP32** | `cuktech-ble-esp32.zip` |
            | **ESP32-S3** | `cuktech-ble-esp32s3.zip` |
            | **ESP32-C3** | `cuktech-ble-esp32c3.zip` |

            每个 zip 包含: `firmware.bin`（完整烧录镜像）, `flash.py`

            ## 首次烧录

            ```bash
            pip install esptool
            unzip cuktech-ble-<target>.zip
            cd <target>/
            python flash.py
            ```

          files: |
            release/cuktech-ble-esp32.zip
            release/cuktech-ble-esp32s3.zip
            release/cuktech-ble-esp32c3.zip
          token: ${{ secrets.PAT_TOKEN }}
