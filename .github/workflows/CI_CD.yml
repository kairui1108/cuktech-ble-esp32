name: Sync, Build & Release

on:
  workflow_dispatch:
    inputs:
      force_release:
        description: '强制发布 Release（即使版本未变更）'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 */2 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      changed: ${{ steps.version.outputs.changed }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - name: Clone this repo
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Clone upstream
        run: |
          git clone https://${{ secrets.PAT_TOKEN }}@github.com/kairui1108/cuktech-ble-ha.git /tmp/upstream

      - name: Check version change
        id: version
        run: |
          UPSTREAM_VER=$(grep '^## v' /tmp/upstream/esp32_ble/RELEASE_NOTE.md | head -1 | sed 's/## v//')
          CURRENT_VER=$(grep '^## v' RELEASE_NOTE.md 2>/dev/null | head -1 | sed 's/## v//' || echo "0.0.0")
          echo "version=$UPSTREAM_VER" >> $GITHUB_OUTPUT
          echo "upstream=$UPSTREAM_VER" >> $GITHUB_OUTPUT
          echo "current=$CURRENT_VER" >> $GITHUB_OUTPUT
          if [ "$UPSTREAM_VER" != "$CURRENT_VER" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Sync files
        run: |
          rsync -av --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='build' \
            --exclude='sdkconfig' \
            --exclude='*.pyc' \
            /tmp/upstream/esp32_ble/ ./
          cp /tmp/upstream/docs/esp32-readme.md README.md
          cp /tmp/upstream/docs/esp32-readme-en.md README.en.md

      - name: Extract release notes
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.upstream }}"
          if [ -f RELEASE_NOTE.md ]; then
            NOTES=$(awk -v ver="${VERSION}" 'BEGIN{f=0} $0 ~ ("^## v" ver){f=1; next} f && $0 ~ "^## v" {exit} f{print}' RELEASE_NOTE.md)
          fi
          NOTES="${NOTES:-See commit history for changes.}"
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://${{ secrets.PAT_TOKEN }}@github.com/kairui1108/cuktech-ble-esp32.git
          git add .
          if ! git diff --cached --quiet; then
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "Sync esp32_ble from upstream (${TIMESTAMP})"
            git push origin HEAD
          fi

  build:
    needs: sync
    strategy:
      fail-fast: false
      matrix:
        target: [esp32, esp32s3, esp32c3]
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.5
    steps:
      - name: Checkout synced code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ github.ref }}

      - name: Build firmware
        run: |
          . /opt/esp/idf/export.sh
          idf.py set-target ${{ matrix.target }}
          # Regenerate embedded_files.h from data/ directory (generated file
          # is not committed to the upstream repo)
          python tools/generate_embedded.py
          idf.py build
          # Merge with IDF's built-in action: the offsets come from
          # build/flash_args, which is generated from partitions.csv
          # (bootloader 0x0 / 0x1000, partition table 0x8000, otadata 0xf000,
          # ota_0 0x20000).  The hand-written merge that used to live here
          # still wrote the app at the old 0x10000 factory offset and omitted
          # otadata, so every released image booted without finding the app.
          idf.py merge-bin

      - name: Prepare artifacts and zip
        run: |
          TARGET=${{ matrix.target }}
          DIST="dist/${TARGET}"
          mkdir -p "${DIST}"

          BUILD_DIR="."
          [ -d esp32_ble/build ] && BUILD_DIR="esp32_ble"
          # Keep the user-facing name firmware.bin; IDF names the merged
          # image merged-binary.bin.
          cp "${BUILD_DIR}/build/merged-binary.bin" "${DIST}/firmware.bin"

          # Determine flash params
          FLASH_MODE="dio"; FLASH_SIZE="4MB"
          if [ "${TARGET}" = "esp32s3" ]; then
            FLASH_MODE="qio"; FLASH_SIZE="8MB"
          fi

          # Write flash script
          cat > "${DIST}/flash.py" << PYEOF
          #!/usr/bin/env python3
          import subprocess, os, sys
          DIR = os.path.dirname(os.path.abspath(__file__))
          TARGET = "${TARGET}"
          FLASH_MODE = "${FLASH_MODE}"
          FLASH_SIZE = "${FLASH_SIZE}"

          _py = sys.executable or "python3"
          # Underscore spellings (write_flash / --flash_mode) and the default
          # reset behaviour work on both esptool 4.x and 5.x.  The hyphenated
          # forms are rejected by 4.x, and the underscore reset values
          # (default_reset) are rejected by 5.x, so neither is passed here.
          cmd = [
              _py, "-m", "esptool", "--chip", TARGET,
              "-b", "460800",
              "write_flash", "--flash_mode", FLASH_MODE, "--flash_size", FLASH_SIZE,
              "0x0", os.path.join(DIR, "firmware.bin"),
          ]

          if len(sys.argv) > 1:
              cmd[3:3] = ["-p", sys.argv[1]]

          print(f"Flashing {TARGET}...")
          subprocess.run(cmd, check=True)
          print("Done!")
          PYEOF
          chmod +x "${DIST}/flash.py"

          # Zip it
          cd dist
          zip -r "cuktech-ble-${TARGET}.zip" "${TARGET}/"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cuktech-ble-${{ matrix.target }}
          path: dist/cuktech-ble-${{ matrix.target }}.zip

  release:
    needs: [sync, build]
    if: needs.sync.outputs.changed == 'true' || inputs.force_release == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          cp artifacts/cuktech-ble-esp32/cuktech-ble-esp32.zip release/
          cp artifacts/cuktech-ble-esp32s3/cuktech-ble-esp32s3.zip release/
          cp artifacts/cuktech-ble-esp32c3/cuktech-ble-esp32c3.zip release/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.sync.outputs.version }}
          name: v${{ needs.sync.outputs.version }}
          body: |
            ${{ needs.sync.outputs.notes }}

            ## 下载

            | 平台 | 文件 |
            |---|---|
            | **ESP32** | `cuktech-ble-esp32.zip` |
            | **ESP32-S3** | `cuktech-ble-esp32s3.zip` |
            | **ESP32-C3** | `cuktech-ble-esp32c3.zip` |

            每个 zip 包含: `firmware.bin`（完整烧录镜像）, `flash.py`

            ## 首次烧录

            ```bash
            pip install esptool
            unzip cuktech-ble-<target>.zip
            cd <target>/
            python flash.py
            ```

          files: |
            release/cuktech-ble-esp32.zip
            release/cuktech-ble-esp32s3.zip
            release/cuktech-ble-esp32c3.zip
          token: ${{ secrets.PAT_TOKEN }}
